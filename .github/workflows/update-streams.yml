# Met à jour les streams Spotify (data/track-streams.js et data/stats.js) chaque lundi
# à partir de kworb.net, puis commite le résultat. Lancement manuel possible :
# onglet « Actions » du dépôt → « Mise à jour des streams » → « Run workflow ».
name: Mise à jour des streams

on:
  schedule:
    - cron: "23 5 * * 1" # lundi 5 h 23 UTC (6 h 23 / 7 h 23 en Belgique)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Récupérer les chiffres sur kworb.net
        run: python scripts/update_streams.py

      - name: Commiter s'il y a du nouveau
        run: |
          if git diff --quiet; then
            echo "Rien n'a changé."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Streams Spotify : relevé du $(date +%Y-%m-%d)"
          git push
